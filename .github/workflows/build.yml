name: Build QMK Macropad

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container: ghcr.io/qmk/qmk_cli

    steps:

      # --------------------------------------------------
      # Checkout QMK
      # --------------------------------------------------
      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive

      # --------------------------------------------------
      # Checkout your macropad repository
      # --------------------------------------------------
      - name: Checkout Macropad
        uses: actions/checkout@v4
        with:
          path: macropad

      # --------------------------------------------------
      # Configure Git
      # --------------------------------------------------
      - name: Configure Git
        run: |
          git config --global --add safe.directory '*'

      # --------------------------------------------------
      # Install keyboard
      # --------------------------------------------------
      - name: Install Macropad
        run: |
          rm -rf keyboards/macropad
          mkdir -p keyboards/macropad

          cp -r macropad/* keyboards/macropad/

          echo "===== MACROPAD FILES ====="
          find keyboards/macropad -type f -print

      - name: Cache QMK build
        uses: actions/cache@v4
        with:
          path: .build
          key: qmk-build-${{ runner.os }}-${{ hashFiles('macropad/**') }}
          restore-keys: |
            qmk-build-${{ runner.os }}-

      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build Firmware
        run: |
          qmk compile -kb macropad -km default

      # --------------------------------------------------
      # Find EXACT firmware produced by this build
      # --------------------------------------------------
      - name: Locate Firmware
        run: |
          echo "===== BUILD OUTPUT ====="

          find .build -type f -name "*.uf2" -print

          UF2=$(find .build -type f -name "macropad_default.uf2" | head -n 1)

          if [ -z "$UF2" ]; then
            echo "ERROR: macropad_default.uf2 was not generated!"
            echo "All UF2 files:"
            find . -type f -name "*.uf2" -print
            exit 1
          fi

          echo "Firmware generated by THIS build:"
          echo "$UF2"

          mkdir -p release

          cp "$UF2" release/macropad_v2_default.uf2

          echo "===== FINAL FIRMWARE ====="
          ls -lh release/macropad_v2_default.uf2

      # --------------------------------------------------
      # Upload build artifact
      # --------------------------------------------------
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macropad-${{ github.sha }}
          path: release/macropad_v2_default.uf2
          retention-days: 30

      # --------------------------------------------------
      # Release on version tag
      # --------------------------------------------------
      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/macropad_v2_default.uf2
          generate_release_notes: true

      # --------------------------------------------------
      # Automatic release on main
      # --------------------------------------------------
      - name: Create Release on Main Push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: release/macropad_v2_default.uf2
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          name: Macropad Build ${{ github.run_number }}
          body: |
            Automatic QMK firmware build.

            Commit:
            ${{ github.sha }}

            Build:
            ${{ github.run_number }}

            Download the UF2 below and flash it to the RP2040.
          draft: false
          prerelease: true