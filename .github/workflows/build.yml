name: Build QMK Macropad

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: qmkfm/qmk_firmware:latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup QMK environment
        run: |
          mkdir -p /qmk_firmware/keyboards/macropad
          cd /qmk_firmware
          qmk setup --home . --no-default-keymap

      - name: Copy keyboard files
        run: |
          cp -r repo/* /qmk_firmware/keyboards/macropad/
          ls -la /qmk_firmware/keyboards/macropad/

      - name: Build Firmware
        run: |
          cd /qmk_firmware
          qmk compile -kb macropad -km default -e CONVERT_TO_RP2040=yes 2>&1 | tee build.log
          
      - name: Find UF2 file
        run: |
          cd /qmk_firmware
          find . -name "*.uf2" -type f -exec ls -lh {} \;
          if [ -f "macropad_default.uf2" ]; then
            cp macropad_default.uf2 /tmp/macropad_v2_default.uf2
          elif [ -f ".build/macropad_default.uf2" ]; then
            cp .build/macropad_default.uf2 /tmp/macropad_v2_default.uf2
          else
            find . -name "*.uf2" -type f -exec cp {} /tmp/macropad_v2_default.uf2 \;
          fi
          ls -lh /tmp/macropad_v2_default.uf2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macropad-uf2
          path: /tmp/macropad_v2_default.uf2
          retention-days: 30

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/macropad_v2_default.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release on Main Push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/macropad_v2_default.uf2
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          body: |
            Automatic build from commit ${{ github.sha }}
            Build number: ${{ github.run_number }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
