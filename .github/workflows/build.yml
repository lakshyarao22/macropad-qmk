name: Build QMK Macropad

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive

      - name: Checkout Macropad
        uses: actions/checkout@v4
        with:
          path: macropad

      - name: Install keyboard files
        run: |
          rm -rf keyboards/macropad
          mkdir -p keyboards/macropad
          cp -r macropad/* keyboards/macropad/

          echo "===== Macropad files ====="
          find keyboards/macropad -maxdepth 3 -type f -print
          
      - name: Build Firmware
        run: |
          qmk compile -kb macropad -km default

      - name: Find Firmware
        run: |
          echo "===== Firmware files ====="
          find . -name "*.uf2" -type f -exec ls -lh {} \;

          UF2=$(find . -name "*.uf2" -type f | head -n 1)

          if [ -z "$UF2" ]; then
            echo "ERROR: No UF2 firmware was generated!"
            exit 1
          fi

          echo "Found firmware: $UF2"
          cp "$UF2" /tmp/macropad_v2_default.uf2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macropad-uf2
          path: /tmp/macropad_v2_default.uf2
          retention-days: 30

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/macropad_v2_default.uf2

      - name: Create Release on Main Push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/macropad_v2_default.uf2
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          body: |
            Automatic build from commit ${{ github.sha }}
            Build number: ${{ github.run_number }}
          draft: false
          prerelease: false
